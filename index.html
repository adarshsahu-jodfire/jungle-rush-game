
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TEMPLE RUN - PRO EDITION</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#07140e;color:white;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:0;left:0;right:0;padding:18px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.logo{font-size:25px;font-weight:1000;font-style:italic;letter-spacing:2px;text-shadow:0 2px 10px black}
.logo span{color:#ffcf46}
.logo small{display:block;font-size:9px;letter-spacing:5px;color:#d0e1d1;margin-top:4px}
.stats{display:flex;gap:8px}
.stat{min-width:72px;text-align:center;background:#061b16d9;border:1px solid #ffffff32;border-radius:11px;padding:10px 12px;backdrop-filter:blur(8px)}
.stat small{display:block;font-size:9px;color:#b5c8b9;letter-spacing:1px;margin-bottom:5px}
.stat b{font-size:20px;color:#ffdc69}
#bar{position:fixed;top:0;left:0;width:0;height:3px;background:#ffcf46;z-index:9}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#06130bbd;z-index:5;padding:20px}
.panel{width:min(440px,100%);text-align:center;padding:32px 25px;border:1px solid #ffffff3b;border-radius:22px;background:#091a14e8;box-shadow:0 25px 90px #0008;backdrop-filter:blur(15px)}
.kicker{font-size:10px;letter-spacing:4px;color:#ffda66;font-weight:bold}
h1{font-size:clamp(43px,9vw,69px);line-height:.9;font-style:italic;margin:20px 0;letter-spacing:-2px}
h1 span{color:#ffcf46}
p{color:#c2d2c6;font-size:13px;line-height:1.8;margin:22px 0}
.main{width:100%;padding:16px;border:0;border-radius:10px;background:linear-gradient(120deg,#ffe990,#f0a71c);font-weight:900;letter-spacing:2px;color:#172015;font-size:14px}
.hint{font-size:10px;line-height:2;color:#9fb5a5;margin-top:16px}
.hide{display:none!important}
.controls{position:fixed;left:0;right:0;bottom:18px;padding:0 18px;display:flex;justify-content:space-between;z-index:4;pointer-events:none}
.group{display:flex;gap:9px;pointer-events:auto}
.ctrl{width:54px;height:54px;border-radius:16px;background:#061b15cf;color:white;border:1px solid #ffffff50;font-size:22px;touch-action:none}
.ctrl:active{background:#9b7229}
#toast{position:fixed;top:25%;left:50%;transform:translateX(-50%);padding:10px 20px;background:#09271eea;border:1px solid #ffdc69;border-radius:25px;color:#ffdc69;font-weight:bold;opacity:0;z-index:4}
@media(max-width:480px){#hud{padding:11px}.logo{font-size:16px}.stat{min-width:53px;padding:8px 5px}.stat b{font-size:16px}.stats{gap:4px}.panel{padding:27px 18px}}
</style>
</head>
<body>
<div id="bar"></div>
<div id="hud">
 <div class="logo">TEMPLE <span>RUN</span><small>PRO EDITION</small></div>
 <div class="stats">
  <div class="stat"><small>DISTANCE</small><b id="dist">0</b></div>
  <div class="stat"><small>COINS</small><b id="coins">0</b></div>
  <div class="stat"><small>BEST</small><b id="best">0</b></div>
 </div>
</div>
<div id="toast">+ GOLD</div>

<div id="menu" class="screen">
 <div class="panel">
  <div class="kicker">THE LOST TEMPLE AWAITS</div>
  <h1>TEMPLE<br><span>RUN.</span></h1>
  <p>Escape the ancient ruins. Run, jump, slide and collect golden treasures. How long can you survive?</p>
  <button class="main" id="start">START RUN &nbsp; ▶</button>
  <div class="hint">← → CHANGE LANE<br>SPACE / ↑ JUMP &nbsp; • &nbsp; ↓ SLIDE</div>
 </div>
</div>

<div id="over" class="screen hide">
 <div class="panel">
  <div class="kicker">RUN COMPLETE</div>
  <h1>GAME<br><span>OVER.</span></h1>
  <p id="result"></p>
  <button class="main" id="again">PLAY AGAIN &nbsp; ↻</button>
  <div class="hint">ONE MORE RUN. BEAT YOUR RECORD.</div>
 </div>
</div>

<div class="controls">
 <div class="group">
  <button class="ctrl" data-a="left">◀</button>
  <button class="ctrl" data-a="right">▶</button>
 </div>
 <div class="group">
  <button class="ctrl" data-a="slide">▼</button>
  <button class="ctrl" data-a="jump">▲</button>
 </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const $=id=>document.getElementById(id);
let scene,camera,renderer,runner;
let state='menu',last=0,clock=0;
let lane=0,targetX=0,jumpY=0,jumpV=0,slideT=0;
let distance=0,coinCount=0,speed=17,best=+(localStorage.getItem('templeProBest')||0);
let spawnT=1,coinT=1,toastT=0;
let obstacles=[],coins=[],world=[],decor=[];
$('best').textContent=best;

const material=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const M={
 road:material(0x68604a),stone:material(0x898069),stone2:material(0xb1a17b),
 jungle:material(0x1a4628),leaf:material(0x27643a),bark:material(0x513522),
 gold:material(0xffc52c,.23,.8),shirt:material(0x345b43),
 skin:material(0xc58c62),pants:material(0x34372b),boot:material(0x201d17),
 wood:material(0x85512c),dark:material(0x17231a),trim:material(0xd2b77d)
};
const laneX=[-2.35,0,2.35];

function addBox(parent,w,h,d,mat,x,y,z){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o;
}
function addSphere(parent,r,mat,x,y,z){
 const o=new THREE.Mesh(new THREE.SphereGeometry(r,12,10),mat);
 o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o;
}
function addCyl(parent,r1,r2,h,mat,x,y,z,n=10){
 const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,n),mat);
 o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o;
}
function addGroup(parent,x=0,y=0,z=0){
 const g=new THREE.Group();g.position.set(x,y,z);parent.add(g);return g;
}

function createTree(x,z,s=1){
 const g=addGroup(scene,x,0,z);g.scale.setScalar(s);
 addCyl(g,.2,.34,3.5,M.bark,0,1.75,0);
 for(let i=0;i<6;i++){
  const crown=addSphere(g,1.05,i%2?M.jungle:M.leaf,
    Math.sin(i*4)*.5,3.0+i*.47,Math.cos(i*2)*.45);
  crown.scale.set(1.3,.8,1.05);
 }
 decor.push(g);
}

function createTemple(){
 const g=addGroup(scene,0,0,-86);
 for(let i=0;i<5;i++)addBox(g,8-i*.55,.3,.8,M.stone,0,.15+i*.3,-i*.8);
 for(const x of [-3.1,3.1]){
  addBox(g,.8,5.6,1,M.stone2,x,2.8,-4);
  addBox(g,1.05,.3,1.2,M.stone,x,5.7,-4);
  addBox(g,.9,.13,1.1,M.trim,x,4.7,-3.95);
 }
 addBox(g,8,.65,1.3,M.stone,0,6.2,-4);
 addBox(g,7.2,.25,1.4,M.trim,0,6.7,-4);
 const roof=new THREE.Mesh(new THREE.ConeGeometry(5,2.6,4),M.stone);
 roof.position.set(0,7.8,-4);roof.rotation.y=Math.PI/4;roof.scale.y=.7;g.add(roof);
 addBox(g,2.8,4,.15,M.dark,0,2,-3.42);
 for(let i=0;i<7;i++)addBox(g,.4,.4,.15,M.trim,-2.7+i*.9,5.1,-3.3);
}

function createRunner(){
 runner=addGroup(scene,0,0,2);

 // backpack
 addBox(runner,.72,.85,.4,M.wood,.4,1.5,.1);
 addBox(runner,.86,1.05,.44,M.shirt,0,1.58,0);
 addBox(runner,.76,.2,.48,M.wood,0,1.03,0);

 // head
 const head=addGroup(runner,0,2.35,0);
 addSphere(head,.31,M.skin,0,0,0);
 addSphere(head,.32,M.bark,0,.1,.01);
 addBox(head,.7,.11,.4,M.trim,0,.08,-.02);
 addSphere(head,.045,M.dark,-.11,-.015,-.28);
 addSphere(head,.045,M.dark,.11,-.015,-.28);

 runner.userData={head,arms:[],legs:[],boots:[]};

 // Limb pivot points are at the shoulder/hip, giving proper running motion.
 for(const side of [-1,1]){
  const arm=addGroup(runner,side*.48,1.92,0);
  addBox(arm,.23,.7,.25,M.skin,0,-.35,0);
  addBox(arm,.27,.23,.28,M.shirt,0,-.08,0);
  runner.userData.arms.push(arm);

  const leg=addGroup(runner,side*.23,1.0,0);
  addBox(leg,.31,.72,.32,M.pants,0,-.36,0);
  addBox(leg,.36,.18,.49,M.boot,0,-.72,-.09);
  runner.userData.legs.push(leg);
 }
}

function createObstacle(type,l,z){
 const g=addGroup(scene,laneX[l+1],0,z);
 if(type==='log'){
  const log=addCyl(g,.38,.38,2.5,M.wood,0,.45,0,12);
  log.rotation.z=Math.PI/2;
  for(let x of [-.65,.65]){
   const band=addCyl(g,.405,.405,.12,M.bark,x,.45,0,12);
   band.rotation.z=Math.PI/2;
  }
 }else if(type==='gate'){
  addBox(g,2.15,.45,.4,M.wood,0,2.05,0);
  addBox(g,.25,2.4,.4,M.bark,-1,1.15,0);
  addBox(g,.25,2.4,.4,M.bark,1,1.15,0);
  addBox(g,2.35,.13,.5,M.trim,0,2.32,0);
 }else{
  const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.8,1),M.stone);
  rock.scale.set(1,.9,.85);rock.position.y=.68;rock.castShadow=true;g.add(rock);
  addSphere(g,.23,M.stone2,-.25,1.05,-.1);
 }
 obstacles.push({obj:g,type,l,hit:false});
}

function createCoins(){
 const l=Math.floor(Math.random()*3)-1;
 for(let i=0,n=5+Math.floor(Math.random()*3);i<n;i++){
  const g=addGroup(scene,laneX[l+1],1.45,-42-i*2);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(.3,.09,10,24),M.gold);
  ring.rotation.y=Math.PI/2;g.add(ring);
  const inner=new THREE.Mesh(new THREE.TorusGeometry(.17,.035,8,18),M.trim);
  inner.rotation.y=Math.PI/2;g.add(inner);
  coins.push({obj:g,l,got:false,phase:Math.random()*7});
 }
}

function createWorld(){
 addBox(scene,180,.5,220,M.jungle,0,-.55,-40);
 addBox(scene,8,.2,190,M.road,0,-.17,-39);
 for(const x of [-4.05,4.05])addBox(scene,.12,.13,190,M.trim,x,-.02,-39);

 // paving slabs and lane markers
 for(let z=8;z>-130;z-=3.4){
  const o=addBox(scene,7.8,.025,.045,M.bark,0,-.04,z);world.push(o);
 }
 for(const x of [-1.18,1.18]){
  for(let z=7;z>-130;z-=7){
   const o=addBox(scene,.045,.03,1.8,M.trim,x,-.005,z);world.push(o);
  }
 }
 for(let z=8;z>-120;z-=9){
  createTree(-6.3+Math.sin(z)*.7,z,1.1);
  createTree(6.3+Math.cos(z)*.7,z-3,1.05);
 }
 createTemple();
 // stone ruins
 for(let z=-17;z>-100;z-=23){
  for(const side of [-1,1]){
   const x=side*5.15;
   addBox(scene,.55,2.6,.7,M.stone,x,1.3,z);
   addBox(scene,.85,.23,.9,M.trim,x,2.7,z);
  }
 }
}

function reset(){
 obstacles.forEach(o=>scene.remove(o.obj));obstacles=[];
 coins.forEach(c=>scene.remove(c.obj));coins=[];
 distance=0;coinCount=0;speed=17;
 lane=0;targetX=0;jumpY=0;jumpV=0;slideT=0;
 spawnT=.8;coinT=1;clock=0;
 runner.position.set(0,0,2);runner.scale.set(1,1,1);
 runner.rotation.set(0,0,0);
 runner.userData.legs.forEach(x=>x.rotation.set(0,0,0));
 runner.userData.arms.forEach(x=>x.rotation.set(0,0,0));
 world.forEach(o=>o.position.z=-Math.random()*120);
 decor.forEach(o=>o.position.z=-Math.random()*115);
 $('dist').textContent=0;$('coins').textContent=0;
 $('bar').style.width='0';
}
function start(){
 reset();state='playing';
 $('menu').classList.add('hide');$('over').classList.add('hide');
}
function end(){
 if(state!=='playing')return;
 state='over';
 best=Math.max(best,Math.floor(distance));
 localStorage.setItem('templeProBest',best);
 $('best').textContent=best;
 $('result').textContent=`Distance: ${Math.floor(distance)} m | Gold coins: ${coinCount}. Try again and beat your record!`;
 $('over').classList.remove('hide');
}

function act(a){
 if(state!=='playing')return;
 if(a==='left')lane=Math.max(-1,lane-1);
 if(a==='right')lane=Math.min(1,lane+1);
 if(a==='jump'&&jumpY===0&&slideT<=0)jumpV=10.5;
 if(a==='slide'&&jumpY<.3)slideT=.75;
}
window.addEventListener('keydown',e=>{
 if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();
 if(state!=='playing'){
  if(e.key==='Enter'||e.key===' ')start();
  return;
 }
 if(e.repeat)return;
 if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')act('left');
 if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')act('right');
 if(e.key==='ArrowUp'||e.key===' ')act('jump');
 if(e.key==='ArrowDown'||e.key.toLowerCase()==='s')act('slide');
});
document.querySelectorAll('[data-a]').forEach(b=>{
 b.addEventListener('pointerdown',e=>{e.preventDefault();act(b.dataset.a)});
});
$('start').onclick=start;$('again').onclick=start;

let sx=0,sy=0;
document.addEventListener('touchstart',e=>{
 if(e.target.closest('button'))return;
 sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY;
},{passive:true});
document.addEventListener('touchend',e=>{
 if(e.target.closest('button'))return;
 const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
 if(Math.abs(dx)>30||Math.abs(dy)>30){
  if(Math.abs(dx)>Math.abs(dy))act(dx>0?'right':'left');
  else act(dy<0?'jump':'slide');
 }
},{passive:true});

function init(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x9abca0);
 scene.fog=new THREE.Fog(0x9abca0,35,110);

 camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,220);
 camera.position.set(0,5.3,10);
 camera.lookAt(0,1,-9);

 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
 renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1.15;
 document.body.appendChild(renderer.domElement);

 scene.add(new THREE.HemisphereLight(0xd9f2ff,0x354626,2));
 const sun=new THREE.DirectionalLight(0xffe3ac,3);
 sun.position.set(-12,22,12);sun.castShadow=true;
 sun.shadow.mapSize.set(1024,1024);
 scene.add(sun);

 // distant mountains and jungle silhouettes
 for(let i=0;i<14;i++){
  const x=-65+i*10;
  const mountain=new THREE.Mesh(new THREE.ConeGeometry(10+Math.random()*8,18+Math.random()*18,5),M.jungle);
  mountain.position.set(x,5,-105-Math.random()*15);scene.add(mountain);
 }
 createWorld();
 createRunner();

 window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
 });
}

function update(dt){
 if(state!=='playing')return;
 clock+=dt;distance+=speed*dt*.85;
 speed=Math.min(32,17+distance*.025);
 spawnT-=dt;coinT-=dt;

 if(spawnT<=0){
  const types=['rock','log','gate'];
  createObstacle(types[Math.floor(Math.random()*3)],Math.floor(Math.random()*3)-1,-65);
  spawnT=Math.max(.85,1.45-distance*.00045+Math.random()*.4);
 }
 if(coinT<=0){createCoins();coinT=2.3+Math.random()}

 // Jump physics
 if(jumpY>0||jumpV>0){
  jumpY+=jumpV*dt;jumpV-=25*dt;
  if(jumpY<0){jumpY=0;jumpV=0}
 }
 if(slideT>0)slideT-=dt;

 targetX=laneX[lane+1];
 runner.position.x=THREE.MathUtils.damp(runner.position.x,targetX,12,dt);
 runner.position.y=jumpY;

 const moving=Math.sin(clock*speed*1.25);
 if(slideT>0){
  runner.scale.y=THREE.MathUtils.damp(runner.scale.y,.58,16,dt);
  runner.rotation.x=THREE.MathUtils.damp(runner.rotation.x,.1,12,dt);
 }else{
  runner.scale.y=THREE.MathUtils.damp(runner.scale.y,1,16,dt);
  runner.rotation.x=THREE.MathUtils.damp(runner.rotation.x,0,12,dt);
  runner.userData.legs[0].rotation.x=moving*.72;
  runner.userData.legs[1].rotation.x=-moving*.72;
  runner.userData.arms[0].rotation.x=-moving*.8;
  runner.userData.arms[1].rotation.x=moving*.8;
 }
 runner.rotation.z=THREE.MathUtils.damp(runner.rotation.z,(targetX-runner.position.x)*-.13,10,dt);

 for(const o of obstacles){
  o.obj.position.z+=speed*dt;
  if(!o.hit&&Math.abs(o.obj.position.z-2)<1.35&&Math.abs(o.obj.position.x-runner.position.x)<.85){
   const safe=o.type==='log'?jumpY>1.05:o.type==='gate'?slideT>0:jumpY>1.25;
   if(!safe){o.hit=true;end();break}
  }
 }
 obstacles=obstacles.filter(o=>{
  if(o.obj.position.z>12){scene.remove(o.obj);return false}return true;
 });

 for(const c of coins){
  c.obj.position.z+=speed*dt;
  c.obj.rotation.y+=dt*2.5;
  c.obj.position.y=1.45+Math.sin(clock*4+c.phase)*.12;
  if(!c.got&&Math.abs(c.obj.position.z-2)<1.3&&Math.abs(c.obj.position.x-runner.position.x)<.9){
   c.got=true;coinCount++;$('coins').textContent=coinCount;
   $('toast').style.opacity=1;toastT=.55;
  }
 }
 coins=coins.filter(c=>{
  if(c.got||c.obj.position.z>12){scene.remove(c.obj);return false}return true;
 });
 if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').style.opacity=0}

 for(const o of world){
  o.position.z+=speed*dt;
  if(o.position.z>12)o.position.z-=130;
 }
 for(const o of decor){
  o.position.z+=speed*dt*.85;
  if(o.position.z>18)o.position.z-=130;
 }

 camera.position.x=THREE.MathUtils.damp(camera.position.x,runner.position.x*.28,3,dt);
 camera.position.y=THREE.MathUtils.damp(camera.position.y,5.3+jumpY*.12,3,dt);
 camera.lookAt(runner.position.x*.2,1.1+jumpY*.12,-9);

 $('dist').textContent=Math.floor(distance);
 $('best').textContent=best;
 $('bar').style.width=(distance%500)/5+'%';
}

function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000||0,.033);last=now;
 update(dt);renderer.render(scene,camera);
}
init();
requestAnimationFrame(animate);
</script>
</body>
</html>
